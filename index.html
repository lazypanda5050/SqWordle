<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SqWordle</title>
    <style>
      :root {
        color-scheme: light;
        --text: #000;
        --muted: #333;
        --border: #888;
        --key: #eee;
        --correct: #8d8;
        --present: #cc4;
        --absent: #888;
        --danger: #b00020;
      }

      *,
      *:before,
      *:after {
        margin: 0;
        box-sizing: border-box;
      }

      body {
        color: var(--text);
        background: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
          Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      }

      main {
        display: grid;
        min-height: 100vh;
        grid-template-rows: auto auto 1fr;
        gap: 1rem;
        padding: 1rem;
        justify-content: center;
        text-align: center;
      }

      h1 {
        font-size: 2em;
        letter-spacing: normal;
        line-height: normal;
      }

      .subtitle {
        color: var(--muted);
        font-size: 0.875rem;
        line-height: normal;
      }

      .shell {
        display: grid;
        gap: 1rem;
      }

      .status {
        min-height: 1.25rem;
        color: var(--text);
        font-weight: 400;
        text-align: center;
      }

      .status.win {
        color: var(--text);
      }

      .status.lose,
      .status.error {
        color: var(--danger);
      }

      .board {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: start;
        gap: 0.5rem;
      }

      .row {
        display: flex;
        gap: 0.5rem;
      }

      .tile {
        display: flex;
        width: clamp(2rem, 10vw, 3rem);
        height: clamp(2rem, 10vw, 3rem);
        align-items: center;
        justify-content: center;
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        background: #fff;
        color: var(--text);
        font-size: clamp(1.25rem, 6vw, 2rem);
        font-weight: 400;
        text-transform: uppercase;
      }

      .tile.correct {
        background: var(--correct);
        border-color: var(--correct);
      }

      .tile.present {
        background: var(--present);
        border-color: var(--present);
      }

      .tile.absent {
        background: var(--absent);
        border-color: var(--absent);
      }

      .row.shake {
        animation: shake 520ms ease;
      }

      .keyboard {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .key-row {
        display: flex;
        justify-content: center;
        gap: 0.25rem;
      }

      button {
        font: inherit;
      }

      button:hover {
        box-shadow: 0 0 0 0.1rem currentColor;
        cursor: pointer;
      }

      .key {
        display: block;
        width: clamp(1.55rem, 7vw, 2rem);
        height: 2.25rem;
        padding: 0;
        border: 1px solid var(--border);
        border-radius: 0.25rem;
        background: var(--key);
        color: var(--text);
        font-size: 1rem;
      }

      .key.wide {
        width: clamp(2.5rem, 11vw, 3rem);
        margin: 0 0.5rem;
        font-size: 0.7rem;
      }

      .key.correct {
        background: var(--correct);
      }

      .key.present {
        background: var(--present);
      }

      .key.absent {
        background: var(--absent);
      }

      .actions {
        display: flex;
        justify-content: center;
      }

      .reset {
        width: 100px;
        height: 30px;
        margin: 20px 10px 0;
        border: 1px solid var(--border);
        border-radius: 20px;
        background: var(--correct);
        color: var(--text);
        text-align: center;
      }

      @keyframes shake {
        8% { transform: translateX(6%); }
        16% { transform: translateX(-6%); }
        24% { transform: translateX(5%); }
        32% { transform: translateX(-5%); }
        40% { transform: translateX(4%); }
        48% { transform: translateX(-4%); }
        56% { transform: translateX(3%); }
        64% { transform: translateX(-3%); }
        72% { transform: translateX(2%); }
        80% { transform: translateX(-2%); }
        88% { transform: translateX(1%); }
        96% { transform: translateX(-1%); }
        100% { transform: translateX(0); }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>SqWordle</h1>
        <p class="subtitle">like <a href="https://www.nytimes.com/games/wordle/index.html">wordle</a> but the answer is always squirtle</p>
      </header>

      <section class="shell" aria-label="SqWordle game">
        <div id="status" class="status" role="status" aria-live="polite">Guess the 8-letter answer.</div>
        <div id="board" class="board" aria-label="Guess board"></div>
        <div id="keyboard" class="keyboard" aria-label="Keyboard"></div>
        <div class="actions">
          <button id="reset" class="reset" type="button">New Game</button>
        </div>
      </section>
    </main>

    <script>
      const answer = "SQUIRTLE";
      const maxGuesses = 6;
      const keyRows = ["QWERTYUIOP", "ASDFGHJKL", "ZXCVBNM"];
      const rank = { absent: 0, present: 1, correct: 2 };
      const wordCache = new Map([[answer, true]]);

      const board = document.getElementById("board");
      const keyboard = document.getElementById("keyboard");
      const status = document.getElementById("status");
      const reset = document.getElementById("reset");

      let guesses;
      let current;
      let gameOver;
      let keyStates;
      let isSubmitting;

      function startGame() {
        guesses = [];
        current = "";
        gameOver = false;
        keyStates = {};
        isSubmitting = false;
        status.textContent = "Guess the 8-letter answer.";
        status.className = "status";
        drawBoard();
        drawKeyboard();
      }

      function drawBoard() {
        board.innerHTML = "";

        for (let rowIndex = 0; rowIndex < maxGuesses; rowIndex += 1) {
          const row = document.createElement("div");
          row.className = "row";

          const guess = guesses[rowIndex] || (rowIndex === guesses.length ? current : "");
          const results = guesses[rowIndex] ? scoreGuess(guess) : [];

          for (let colIndex = 0; colIndex < answer.length; colIndex += 1) {
            const tile = document.createElement("div");
            tile.className = "tile";
            tile.textContent = guess[colIndex] || "";
            tile.setAttribute("aria-label", tile.textContent || "empty");

            if (tile.textContent) tile.classList.add("filled");
            if (results[colIndex]) tile.classList.add(results[colIndex]);
            row.appendChild(tile);
          }

          board.appendChild(row);
        }
      }

      function drawKeyboard() {
        keyboard.innerHTML = "";

        keyRows.forEach((letters, rowIndex) => {
          const row = document.createElement("div");
          row.className = "key-row";

          if (rowIndex === 2) row.appendChild(makeKey("Enter", "wide"));

          letters.split("").forEach((letter) => {
            row.appendChild(makeKey(letter, keyStates[letter] || ""));
          });

          if (rowIndex === 2) row.appendChild(makeKey("Back", "wide"));
          keyboard.appendChild(row);
        });
      }

      function makeKey(label, extraClass) {
        const key = document.createElement("button");
        key.type = "button";
        key.className = ["key", extraClass].filter(Boolean).join(" ");
        key.textContent = label;
        key.setAttribute("aria-label", label === "Back" ? "Backspace" : label);
        key.addEventListener("click", () => handleInput(label));
        return key;
      }

      function handleInput(input) {
        if (isSubmitting) return;
        if (gameOver && input !== "Enter") return;

        if (input === "Enter") {
          submitGuess();
          return;
        }

        if (input === "Back" || input === "Backspace") {
          current = current.slice(0, -1);
          drawBoard();
          return;
        }

        const letter = input.toUpperCase();
        if (/^[A-Z]$/.test(letter) && current.length < answer.length) {
          current += letter;
          drawBoard();
        }
      }

      async function submitGuess() {
        if (isSubmitting) return;

        if (gameOver) {
          startGame();
          return;
        }

        if (current.length !== answer.length) {
          showMessage("Not enough letters.", "error");
          shakeCurrentRow();
          return;
        }

        const guess = current;
        isSubmitting = true;
        showMessage("Checking word...");

        try {
          const isWord = await isRealWord(guess);
          if (!isWord) {
            showMessage("Not in word list.", "error");
            shakeCurrentRow();
            return;
          }
        } catch {
          showMessage("Could not check word. Try again.", "error");
          shakeCurrentRow();
          return;
        } finally {
          isSubmitting = false;
        }

        const results = scoreGuess(guess);
        guesses.push(guess);
        current = "";
        updateKeyStates(guess, results);
        drawBoard();
        drawKeyboard();
        revealLastRow();

        if (guess === answer) {
          gameOver = true;
          showMessage(`You found Squirtle in ${guesses.length} ${guesses.length === 1 ? "guess" : "guesses"}!`, "win");
          return;
        }

        if (guesses.length === maxGuesses) {
          gameOver = true;
          showMessage("Out of guesses. It was SQUIRTLE.", "lose");
          return;
        }

        showMessage(`${maxGuesses - guesses.length} guesses left.`);
      }

      async function isRealWord(word) {
        if (wordCache.has(word)) return wordCache.get(word);

        const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word.toLowerCase()}`);
        const isWord = response.ok;
        wordCache.set(word, isWord);
        return isWord;
      }

      function scoreGuess(guess) {
        const results = Array(answer.length).fill("absent");
        const remaining = {};

        for (let index = 0; index < answer.length; index += 1) {
          if (guess[index] === answer[index]) {
            results[index] = "correct";
          } else {
            remaining[answer[index]] = (remaining[answer[index]] || 0) + 1;
          }
        }

        for (let index = 0; index < answer.length; index += 1) {
          const letter = guess[index];
          if (results[index] === "correct") continue;
          if (remaining[letter]) {
            results[index] = "present";
            remaining[letter] -= 1;
          }
        }

        return results;
      }

      function updateKeyStates(guess, results) {
        guess.split("").forEach((letter, index) => {
          const result = results[index];
          if (!keyStates[letter] || rank[result] > rank[keyStates[letter]]) {
            keyStates[letter] = result;
          }
        });
      }

      function showMessage(message, type = "") {
        status.textContent = message;
        status.className = ["status", type].filter(Boolean).join(" ");
      }

      function shakeCurrentRow() {
        const row = board.children[guesses.length];
        if (!row) return;
        row.classList.remove("shake");
        void row.offsetWidth;
        row.classList.add("shake");
      }

      function revealLastRow() {
        const row = board.children[guesses.length - 1];
        if (!row) return;
        Array.from(row.children).forEach((tile, index) => {
          tile.style.animationDelay = `${index * 70}ms`;
          tile.classList.add("reveal");
        });
      }

      document.addEventListener("keydown", (event) => {
        if (event.ctrlKey || event.metaKey || event.altKey) return;
        if (event.key === "Enter" || event.key === "Backspace" || /^[a-z]$/i.test(event.key)) {
          event.preventDefault();
          handleInput(event.key);
        }
      });

      reset.addEventListener("click", startGame);
      startGame();
    </script>
  </body>
</html>
