<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SqWordle</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #061923;
        --panel: #0c2835;
        --panel-strong: #123746;
        --text: #f1fbff;
        --muted: #9ec8d2;
        --empty: #1a4454;
        --border: #3c7180;
        --correct: #58b06f;
        --present: #d4ad45;
        --absent: #31505d;
        --accent: #7bd8ef;
        --danger: #ff7d7d;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top left, rgba(123, 216, 239, 0.28), transparent 32rem),
          radial-gradient(circle at bottom right, rgba(88, 176, 111, 0.2), transparent 26rem),
          linear-gradient(145deg, #041018, var(--bg));
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(100%, 34rem);
        min-height: 100vh;
        padding: 1.25rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 1.25rem;
      }

      header {
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.4rem, 11vw, 4.5rem);
        letter-spacing: -0.08em;
        line-height: 0.9;
      }

      .subtitle {
        margin: 0.7rem auto 0;
        max-width: 28rem;
        color: var(--muted);
        font-size: 0.98rem;
        line-height: 1.5;
      }

      .shell {
        padding: 1rem;
        border: 1px solid rgba(123, 216, 239, 0.22);
        border-radius: 1.35rem;
        background: rgba(12, 40, 53, 0.78);
        box-shadow: 0 1.5rem 5rem rgba(0, 0, 0, 0.28);
        backdrop-filter: blur(14px);
      }

      .status {
        min-height: 2.7rem;
        margin-bottom: 0.8rem;
        display: grid;
        place-items: center;
        border-radius: 0.9rem;
        background: rgba(6, 25, 35, 0.72);
        color: var(--muted);
        font-weight: 700;
        letter-spacing: 0.01em;
        text-align: center;
      }

      .status.win {
        color: #baffc9;
      }

      .status.lose,
      .status.error {
        color: var(--danger);
      }

      .board {
        display: grid;
        grid-template-rows: repeat(6, 1fr);
        gap: clamp(0.28rem, 1.8vw, 0.48rem);
      }

      .row {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: clamp(0.28rem, 1.8vw, 0.48rem);
      }

      .tile {
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        border: 2px solid var(--empty);
        border-radius: clamp(0.42rem, 2vw, 0.7rem);
        background: rgba(6, 25, 35, 0.84);
        color: var(--text);
        font-size: clamp(1.15rem, 6vw, 2rem);
        font-weight: 900;
        text-transform: uppercase;
        transition: transform 160ms ease, background 200ms ease, border-color 200ms ease;
      }

      .tile.filled {
        border-color: var(--border);
        transform: scale(1.04);
      }

      .tile.correct {
        background: var(--correct);
        border-color: var(--correct);
      }

      .tile.present {
        background: var(--present);
        border-color: var(--present);
      }

      .tile.absent {
        background: var(--absent);
        border-color: var(--absent);
      }

      .tile.reveal {
        animation: reveal 480ms ease both;
      }

      .row.shake {
        animation: shake 260ms ease;
      }

      .keyboard {
        display: grid;
        gap: 0.45rem;
        margin-top: 1rem;
      }

      .key-row {
        display: flex;
        justify-content: center;
        gap: 0.38rem;
      }

      button {
        border: 0;
        border-radius: 0.65rem;
        background: var(--panel-strong);
        color: var(--text);
        font: inherit;
        font-weight: 900;
        cursor: pointer;
        transition: transform 120ms ease, filter 120ms ease, background 160ms ease;
      }

      button:hover {
        filter: brightness(1.12);
      }

      button:active {
        transform: translateY(1px) scale(0.98);
      }

      .key {
        min-width: 0;
        width: clamp(1.8rem, 8vw, 2.85rem);
        height: clamp(2.65rem, 11vw, 3.35rem);
        font-size: clamp(0.8rem, 3.2vw, 1rem);
      }

      .key.wide {
        width: clamp(3.7rem, 16vw, 5.3rem);
        font-size: clamp(0.68rem, 2.8vw, 0.85rem);
      }

      .key.correct {
        background: var(--correct);
      }

      .key.present {
        background: var(--present);
      }

      .key.absent {
        background: var(--absent);
      }

      .actions {
        display: flex;
        justify-content: center;
        margin-top: 0.9rem;
      }

      .reset {
        padding: 0.8rem 1.2rem;
        background: var(--accent);
        color: #06212b;
      }

      @keyframes reveal {
        0% { transform: rotateX(0deg); }
        50% { transform: rotateX(90deg); }
        100% { transform: rotateX(0deg); }
      }

      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-0.45rem); }
        75% { transform: translateX(0.45rem); }
      }

      @media (max-width: 430px) {
        main {
          padding: 0.8rem;
        }

        .shell {
          padding: 0.7rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>SqWordle</h1>
        <p class="subtitle">Wordle, but the answer is always <strong>Squirtle</strong>. Six guesses, eight letters, one tiny turtle.</p>
      </header>

      <section class="shell" aria-label="SqWordle game">
        <div id="status" class="status" role="status" aria-live="polite">Guess the 8-letter answer.</div>
        <div id="board" class="board" aria-label="Guess board"></div>
        <div id="keyboard" class="keyboard" aria-label="Keyboard"></div>
        <div class="actions">
          <button id="reset" class="reset" type="button">New Game</button>
        </div>
      </section>
    </main>

    <script>
      const answer = "SQUIRTLE";
      const maxGuesses = 6;
      const keyRows = ["QWERTYUIOP", "ASDFGHJKL", "ZXCVBNM"];
      const rank = { absent: 0, present: 1, correct: 2 };

      const board = document.getElementById("board");
      const keyboard = document.getElementById("keyboard");
      const status = document.getElementById("status");
      const reset = document.getElementById("reset");

      let guesses;
      let current;
      let gameOver;
      let keyStates;

      function startGame() {
        guesses = [];
        current = "";
        gameOver = false;
        keyStates = {};
        status.textContent = "Guess the 8-letter answer.";
        status.className = "status";
        drawBoard();
        drawKeyboard();
      }

      function drawBoard() {
        board.innerHTML = "";

        for (let rowIndex = 0; rowIndex < maxGuesses; rowIndex += 1) {
          const row = document.createElement("div");
          row.className = "row";

          const guess = guesses[rowIndex] || (rowIndex === guesses.length ? current : "");
          const results = guesses[rowIndex] ? scoreGuess(guess) : [];

          for (let colIndex = 0; colIndex < answer.length; colIndex += 1) {
            const tile = document.createElement("div");
            tile.className = "tile";
            tile.textContent = guess[colIndex] || "";
            tile.setAttribute("aria-label", tile.textContent || "empty");

            if (tile.textContent) tile.classList.add("filled");
            if (results[colIndex]) tile.classList.add(results[colIndex]);
            row.appendChild(tile);
          }

          board.appendChild(row);
        }
      }

      function drawKeyboard() {
        keyboard.innerHTML = "";

        keyRows.forEach((letters, rowIndex) => {
          const row = document.createElement("div");
          row.className = "key-row";

          if (rowIndex === 2) row.appendChild(makeKey("Enter", "wide"));

          letters.split("").forEach((letter) => {
            row.appendChild(makeKey(letter, keyStates[letter] || ""));
          });

          if (rowIndex === 2) row.appendChild(makeKey("Back", "wide"));
          keyboard.appendChild(row);
        });
      }

      function makeKey(label, extraClass) {
        const key = document.createElement("button");
        key.type = "button";
        key.className = ["key", extraClass].filter(Boolean).join(" ");
        key.textContent = label;
        key.setAttribute("aria-label", label === "Back" ? "Backspace" : label);
        key.addEventListener("click", () => handleInput(label));
        return key;
      }

      function handleInput(input) {
        if (gameOver && input !== "Enter") return;

        if (input === "Enter") {
          submitGuess();
          return;
        }

        if (input === "Back" || input === "Backspace") {
          current = current.slice(0, -1);
          drawBoard();
          return;
        }

        const letter = input.toUpperCase();
        if (/^[A-Z]$/.test(letter) && current.length < answer.length) {
          current += letter;
          drawBoard();
        }
      }

      function submitGuess() {
        if (gameOver) {
          startGame();
          return;
        }

        if (current.length !== answer.length) {
          showMessage("Not enough letters.", "error");
          shakeCurrentRow();
          return;
        }

        const guess = current;
        const results = scoreGuess(guess);
        guesses.push(guess);
        current = "";
        updateKeyStates(guess, results);
        drawBoard();
        drawKeyboard();
        revealLastRow();

        if (guess === answer) {
          gameOver = true;
          showMessage(`You found Squirtle in ${guesses.length} ${guesses.length === 1 ? "guess" : "guesses"}!`, "win");
          return;
        }

        if (guesses.length === maxGuesses) {
          gameOver = true;
          showMessage("Out of guesses. It was SQUIRTLE.", "lose");
          return;
        }

        showMessage(`${maxGuesses - guesses.length} guesses left.`);
      }

      function scoreGuess(guess) {
        const results = Array(answer.length).fill("absent");
        const remaining = {};

        for (let index = 0; index < answer.length; index += 1) {
          if (guess[index] === answer[index]) {
            results[index] = "correct";
          } else {
            remaining[answer[index]] = (remaining[answer[index]] || 0) + 1;
          }
        }

        for (let index = 0; index < answer.length; index += 1) {
          const letter = guess[index];
          if (results[index] === "correct") continue;
          if (remaining[letter]) {
            results[index] = "present";
            remaining[letter] -= 1;
          }
        }

        return results;
      }

      function updateKeyStates(guess, results) {
        guess.split("").forEach((letter, index) => {
          const result = results[index];
          if (!keyStates[letter] || rank[result] > rank[keyStates[letter]]) {
            keyStates[letter] = result;
          }
        });
      }

      function showMessage(message, type = "") {
        status.textContent = message;
        status.className = ["status", type].filter(Boolean).join(" ");
      }

      function shakeCurrentRow() {
        const row = board.children[guesses.length];
        if (!row) return;
        row.classList.remove("shake");
        void row.offsetWidth;
        row.classList.add("shake");
      }

      function revealLastRow() {
        const row = board.children[guesses.length - 1];
        if (!row) return;
        Array.from(row.children).forEach((tile, index) => {
          tile.style.animationDelay = `${index * 70}ms`;
          tile.classList.add("reveal");
        });
      }

      document.addEventListener("keydown", (event) => {
        if (event.ctrlKey || event.metaKey || event.altKey) return;
        if (event.key === "Enter" || event.key === "Backspace" || /^[a-z]$/i.test(event.key)) {
          event.preventDefault();
          handleInput(event.key);
        }
      });

      reset.addEventListener("click", startGame);
      startGame();
    </script>
  </body>
</html>
